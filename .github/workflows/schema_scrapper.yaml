name: Schema Scrapper
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to scrape"
        required: true
        default: "v1.21.90"
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Run Schema Scrapper
        run: |
          bun install
          bun ./scripts/schema_scrapper/main.ts ${{ inputs.version }}
      - name: Get version
        id: get_version
        run: |
          curl -s https://raw.githubusercontent.com/Mojang/bedrock-samples/main/version.json > ./temp/version.json
          jq -r '.latest.version' ./temp/version.json > ./temp/version.txt
          echo "Version: v$(cat ./temp/version.txt)"
          echo "version=v$(cat ./temp/version.txt)" >> $GITHUB_OUTPUT
      - name: Create Commit
        run: |
          git add .
          git config --global user.email "bot@github.com"
          git config --global user.name "Github Bot"
          git commit -m "${{ steps.get_version.outputs.version }}"
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.get_version.outputs.version }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "${{ steps.get_version.outputs.version }}"
          title: "${{ steps.get_version.outputs.version }}"
          body: |
            This is an automated pull request to update the schema.
            - [ ] Review the changes
          branch: ${{ steps.get_version.outputs.version }}
          base: main
          reviewers: "respectZ"
          assignees: "respectZ"
          draft: false
